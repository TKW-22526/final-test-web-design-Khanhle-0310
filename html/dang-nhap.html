</head>
<body>

<div class="dangnhap">
    <div class="khung-dangnhap">
        <h2>Đăng nhập</h2>
        <p>Chào mừng bạn đến với Tiệm Ăn Vặt Tuổi Thơ</p>

        <input type="text" id="user" placeholder="Tên đăng nhập">
        <input type="password" id="pass" placeholder="Mật khẩu">

        <button onclick="dangNhap()">Đăng nhập</button>

        <p>Chưa có tài khoản? <a href="#">Đăng ký</a></p>
    </div>
</div>

<script>

function dangNhap(){

    var user=document.getElementById("user").value;
    var pass=document.getElementById("pass").value;

    if(user=="admin" && pass=="123"){

        alert("Đăng nhập thành công!");

        window.location="../index.html";

    }
    else{

        alert("Sai tài khoản hoặc mật khẩu!");

    }

}

</script>

</body>
